<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>ECC Tools</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="/static/css/style.css" rel="stylesheet">
  <script src="/static/js/utils.js"></script>
</head>
<body class="p-6">
  <a href="/">← Back</a>
  <h1 class="text-2xl font-bold text-green-300 my-4">ECC Tools</h1>

  <!-- Key Upload Section -->
  <section class="mb-6">
    <h2 class="font-semibold">Upload PEM Key</h2>
    <form id="pemForm">
      <input type="file" name="pem" required />
      <button class="px-3 py-1 bg-green-500 rounded">Upload & Parse</button>
    </form>
    <pre id="pemOut" class="mt-2 p-3 bg-black rounded h-40 overflow-auto"></pre>
  </section>

  <!-- Encrypt / Decrypt Section -->
  <section>
    <h2 class="font-semibold">Encrypt / Decrypt</h2>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-3 max-w-2xl">
      <textarea id="plain" placeholder="Plaintext" class="p-2 bg-gray-900 rounded"></textarea>
      <textarea id="cipher" placeholder="Ciphertext (base64)" class="p-2 bg-gray-900 rounded"></textarea>
      <input id="pubkey" placeholder="Recipient Public Key (hex/base64)" class="p-2 bg-gray-900 rounded" />
      <input id="privkey" placeholder="Your Private Key (hex/base64)" class="p-2 bg-gray-900 rounded" />
    </div>
    <div class="mt-3 flex gap-3">
      <button id="eccEnc" class="px-3 py-1 bg-green-500 rounded">Encrypt</button>
      <button id="eccDec" class="px-3 py-1 bg-green-500 rounded">Decrypt</button>
    </div>
    <pre id="eccOut" class="mt-2 p-3 bg-black rounded h-56 overflow-auto"></pre>
  </section>

  <script>
    // PEM parsing
    document.getElementById('pemForm').onsubmit = async (e) => {
      e.preventDefault();
      const form = new FormData(e.target);
      document.getElementById('pemOut').textContent = "Working...";
      const resp = await fetch('/api/ecc/pem', { method:'POST', body: form });
      const json = await resp.json();
      document.getElementById('pemOut').textContent = JSON.stringify(json, null, 2);
    };

    // Encrypt
    document.getElementById('eccEnc').onclick = async () => {
      const plain = document.getElementById('plain').value;
      const pub = document.getElementById('pubkey').value;
      document.getElementById('eccOut').textContent = "Encrypting...";
      const resp = await fetch('/api/ecc/encrypt', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ plaintext: plain, pubkey: pub })
      });
      const json = await resp.json();
      document.getElementById('eccOut').textContent = JSON.stringify(json, null, 2);
    };

    // Decrypt
    document.getElementById('eccDec').onclick = async () => {
      const cipher = document.getElementById('cipher').value;
      const priv = document.getElementById('privkey').value;
      document.getElementById('eccOut').textContent = "Decrypting...";
      const resp = await fetch('/api/ecc/decrypt', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ ciphertext: cipher, privkey: priv })
      });
      const json = await resp.json();
      document.getElementById('eccOut').textContent = JSON.stringify(json, null, 2);
    };
  </script>
</body>
</html>
