<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Encoding / Decoding</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="/static/css/style.css" rel="stylesheet">
  <script src="/static/js/utils.js"></script>
</head>
<body class="p-6">
  <a href="/">← Back</a>
  <h1 class="text-2xl font-bold text-cyan-300 my-4">Encoding / Decoding Playground</h1>

  <div class="max-w-2xl">
    <select id="op" class="p-2 bg-gray-900 rounded">
      <option value="base64-encode">Base64 Encode</option>
      <option value="base64-decode">Base64 Decode</option>
      <option value="hex-encode">Hex Encode</option>
      <option value="hex-decode">Hex Decode</option>
      <option value="url-encode">URL Encode</option>
      <option value="url-decode">URL Decode</option>
    </select>

    <textarea id="data" class="w-full mt-3 p-3 bg-gray-900 rounded" rows="6" placeholder="Enter text"></textarea>
    <div class="mt-3">
      <button id="run" class="px-4 py-2 bg-cyan-500 rounded">Run</button>
    </div>

    <pre id="out" class="mt-3 p-3 bg-black rounded h-48 overflow-auto"></pre>
  </div>

  <script>
    document.getElementById('run').onclick = async () => {
      const op = document.getElementById('op').value;
      const data = document.getElementById('data').value;
      if(!data){ alert('Enter text'); return; }
      document.getElementById('out').textContent = 'Working...';
      const resp = await fetch('/api/encode/' + op, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({data}) });
      const j = await resp.json();
      document.getElementById('out').textContent = JSON.stringify(j, null, 2);
    };
  </script>
</body>
</html>
