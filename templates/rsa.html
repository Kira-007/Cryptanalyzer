<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>RSA Tools</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="/static/css/style.css" rel="stylesheet">
  <script src="/static/js/utils.js"></script>
</head>
<body class="p-6">
  <a href="/">← Back</a>
  <h1 class="text-2xl font-bold text-cyan-300 my-4">RSA Tools</h1>

  <section class="mb-6">
    <h2 class="font-semibold">Extract from PEM</h2>
    <form id="pemForm">
      <input type="file" name="public" required />
      <button class="px-3 py-1 bg-cyan-500 rounded">Upload & Extract</button>
    </form>
    <pre id="pemOut" class="mt-2 p-3 bg-black rounded h-40 overflow-auto"></pre>
  </section>

  <section>
    <h2 class="font-semibold">Factor / decrypt by params</h2>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-3 max-w-2xl">
      <input id="n" placeholder="n (modulus)" class="p-2 bg-gray-900 rounded" />
      <input id="e" placeholder="e (public exponent)" class="p-2 bg-gray-900 rounded" />
      <input id="c" placeholder="c (ciphertext)" class="p-2 bg-gray-900 rounded" />
      <input id="p" placeholder="p (prime, optional)" class="p-2 bg-gray-900 rounded" />
      <input id="q" placeholder="q (prime, optional)" class="p-2 bg-gray-900 rounded" />
    </div>
    <div class="mt-3">
      <button id="rsaRun" class="px-3 py-1 bg-cyan-500 rounded">Run</button>
    </div>
    <pre id="rsaOut" class="mt-2 p-3 bg-black rounded h-56 overflow-auto"></pre>
  </section>

  <script>
    document.getElementById('pemForm').onsubmit = async (e) => {
      e.preventDefault();
      const form = new FormData(e.target);
      document.getElementById('pemOut').textContent = "Working...";
      const resp = await fetch('/api/rsa/pem', { method:'POST', body: form });
      const json = await resp.json();
      document.getElementById('pemOut').textContent = JSON.stringify(json, null, 2);
    };

    document.getElementById('rsaRun').onclick = async () => {
      const n = document.getElementById('n').value || null;
      const e = document.getElementById('e').value || null;
      const c = document.getElementById('c').value || null;
      const p = document.getElementById('p').value || null;
      const q = document.getElementById('q').value || null;
      const body = { n: n ? Number(n) : null, e: e ? Number(e) : null, c: c ? Number(c) : null, p: p ? Number(p) : null, q: q ? Number(q) : null };
      document.getElementById('rsaOut').textContent = "Running...";
      const resp = await fetch('/api/rsa/factor', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
      const json = await resp.json();
      document.getElementById('rsaOut').textContent = JSON.stringify(json, null, 2);
    };
  </script>
</body>
</html>
